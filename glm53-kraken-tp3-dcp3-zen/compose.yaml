# GLM-5.3-Flash on 3x RTX PRO 6000 Blackwell (TP3, DCP3, MTP3), image azallaza/glm53-kraken-tp3:20261008.
#
# Start it with ./launch.sh, which reads .env, runs the safety checks and derives GPU_ID_1..3 and
# MOE_TP. Running `docker compose up` by hand also works if you export those variables yourself.
#
# The serve script is the one baked into the image (/usr/local/bin/serve-glm53-flash-tp3-kraken.py,
# sha256 ea27f13a...). It turns the environment below into the vLLM command line.
name: glm53-kraken-tp3-dcp3-zen

services:
  glm53-kraken-tp3-dcp3-zen:
    # azallaza/glm53-kraken-tp3:20261008, pinned by digest.
    image: azallaza/glm53-kraken-tp3@sha256:44c2d27ec0269e4620895a3ce21f639ee93f9e4d9b935e896ed52a3a6900c486
    container_name: glm53-kraken-tp3-dcp3-zen
    restart: "no"
    init: true
    ipc: host
    shm_size: "64gb"
    cpuset: "${CPUSET:?set CPUSET in .env (or run ./launch.sh)}"
    stop_grace_period: 90s
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:?set HOST_PORT in .env}:8000"
    volumes:
      # Hugging Face cache that holds hub/models--local-inference-lab--.../snapshots/<revision>.
      - "${HF_CACHE_DIR:?set HF_CACHE_DIR in .env}:/root/.cache/huggingface:ro"
      # JIT / autotune / compile caches; reused across restarts (faster second start).
      - "${RUNTIME_CACHE_DIR:?set RUNTIME_CACHE_DIR in .env}:/cache"
    environment:
      # Checkpoint. csf-qad-2 = local-inference-lab/GLM-5.3-Flash-NVFP4-MXFP8-CSF-QAD @ dec48abd
      # (needs MOE_TP=1). default = local-inference-lab/GLM-5.3-Flash-NVFP4 @ 175ae8ce (MOE_TP=0).
      # The serve script derives the model id and revision from CHECKPOINT.
      CHECKPOINT: "${CHECKPOINT:-csf-qad-2}"
      MOE_TP: "${MOE_TP:-1}"
      SERVED_MODEL_NAME: "${SERVED_MODEL_NAME:-GLM-5.3-Flash-Kraken-TP3}"
      # MTP speculative decoding, 3 draft tokens (the serve script's default depth).
      MODE: mtp
      # Decode context parallel over the 3 GPUs: the KV cache is split, not replicated.
      DCP: "3"
      MAX_NUM_SEQS: "32"
      MAX_NUM_BATCHED_TOKENS: "4096"
      MAX_MODEL_LEN: "1048576"
      GPU_MEMORY_UTILIZATION: "0.95"
      # CUDA graphs up to 128 rows. With MTP3 every stream needs 4 rows per decode step, so the
      # image default (32 rows) only covers 8 streams; above that every step ran eagerly and
      # throughput collapsed to ~22 tok/s per user. 128 rows = 32 streams x 4.
      MAX_CUDAGRAPH_CAPTURE_SIZE: "128"
      CUDAGRAPH_CAPTURE_SIZES: "1 2 4 8 16 24 32 48 64 96 128"
      # NCCL for the PyNCCL tensor-parallel all-reduce over PCIe.
      NCCL_PROTO: "LL,LL128"
      NCCL_MIN_NCHANNELS: "8"
      NCCL_MAX_NCHANNELS: "8"
      # 0 = PyNCCL TP all-reduce (validated); 1 = b12x PCIe one-shot (publisher compose default; not validated here).
      VLLM_ENABLE_PCIE_ALLREDUCE: "0"
      VLLM_PCIE_ONESHOT_ALLREDUCE_MAX_SIZE: 256KB
      VLLM_TP3_PCIE_DCP: "0"
      KV_RECLAIM: auto
      VLLM_B12X_BF16_GEMV: "1"
      VLLM_USE_FASTOKENS: "1"
      REASONING_EFFORT: max
      CLEAR_THINKING: "true"
      ADDITIONAL_CONFIG: '{"glm53_kda_decode_backend":"b12x","kda_prefill_backend":"flashkda"}'
      VLLM_GLM53_FP8_DENSE: "1"
      VLLM_GLM53_FP8_LM_HEAD: "1"
      VLLM_GLM53_FP8_FFN: "1"
      VLLM_GLM53_FP8_MTP: "1"
      VLLM_GLM53_FP8_PREFILL: w8a8
      VLLM_GLM53_L2_PREFETCH_BUDGET_A_MB: "10"
      VLLM_GLM53_L2_PREFETCH_BUDGET_B_MB: "25"
      VLLM_GLM53_L2_PREFETCH_BUDGET_C_MB: "7.5"
      VLLM_GLM53_L2_PREFETCH_BUDGET_A_MLA_MB: "18"
      GLM53_TP3_REQUIRE_RUNTIME_PROOF: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # launch.sh splits GPU_IDS="a,b,c" into these three.
              device_ids: ["${GPU_ID_1:?run ./launch.sh}", "${GPU_ID_2:?run ./launch.sh}", "${GPU_ID_3:?run ./launch.sh}"]
              capabilities: [gpu]
    entrypoint: ["/opt/venv/bin/python", "/usr/local/bin/serve-glm53-flash-tp3-kraken.py"]
    command: []
