name: deepseek-v41-flare-brrr-d4-export
services:
  export:
    image: "${PREP_IMAGE:?Run build.sh first}"
    init: true
    restart: "no"
    user: "${HOST_UID:?Run export.sh}:${HOST_GID:?Run export.sh}"
    cpus: 8
    cpu_shares: 128
    mem_limit: 216g
    memswap_limit: 216g
    shm_size: 16g
    pids_limit: 2048
    security_opt:
      - seccomp=unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      HOME: /work
      HF_HUB_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: "${GPU_IDS:?Select four GPU UUIDs}"
      CUDA_VISIBLE_DEVICES: "${GPU_IDS:?Select four GPU UUIDs}"
    entrypoint: ["/opt/flare-venv/bin/python", "-u", "-m", "ignition"]
    command:
      - export
      - deepseek-v4.1-flash
      - --config
      - /work/settings/prepare.toml
      - --gpus
      - "0,1,2,3"
      - --max-concurrency
      - "32"
      - --image-concurrency
      - "4"
      - --prefill-chunk-size
      - "4096"
      - --mtp-draft-tokens
      - "4"
      - --speculative-token-capacity
      - "128"
      - --speculative-graph-budget
      - "64"
      - --expert-scale-compression
      - native
      - --mla-compute-mode
      - bf16
      - --draft-head-quantization
      - nvfp4
      - --markov-head-quantization
      - fp8
      - --vocabulary-parallel-sampling
      - --collective-tuning
      - runtime
      - --collective-ladder
      - /src/ignition/preparation/ladders/gb202_pcie_tp4_clustered_full.json
      - --compile-workers
      - "4"
      - --autotune-effort
      - default
    volumes:
      - type: bind
        source: "${WORK_DIR:?Run export.sh}"
        target: /work
        bind:
          create_host_path: false
      - type: bind
        source: "${MODEL_DIR:?Download the checkpoint}"
        target: "/work/hub/models--deepseek-ai--DeepSeek-V4.1-Flash-1017/snapshots/${MODEL_REVISION:?Run export.sh}"
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${RECIPE_DIR:?Run export.sh}/prepare/export.toml"
        target: /work/settings/prepare.toml
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU0:?}", "${GPU1:?}", "${GPU2:?}", "${GPU3:?}"]
              capabilities: [gpu]
